 for(const q of FLAT){const kk=(t-q[0])/.5;if(kk>0&&kk<1){dy-=(.5-.5*Math.cos(kk*Math.PI*2))*28;sq=1+Math.sin(kk*Math.PI*2)*.02}}
 const sway=M?0:Math.sin(t*1.6)*1.2; if(!M)dy+=Math.sin(t*2.2)*6;

 const en=VIS.energy?(VIS.energy[fi]||0):(talk?.7:0);
 const nod=en>.05?(Math.sin(t*7.3)*3+Math.sin(t*3.1)*2)*(.5+en*.7):Math.sin(t*1.4)*1.5;
 let lift=-Math.abs(Math.sin(t*9))*4*en,tilt=nod;
 if(M){const T=motionTransforms(M,MP_HIP,MP_FEET,MP_WAIST||undefined);
  $('root')?.setAttribute('transform',T.root);$('legs')?.setAttribute('transform',T.legs);$('upper')?.setAttribute('transform',T.upper);$('armsrig')?.setAttribute('transform',T.arms);
  tilt=M.headTilt;lift=T.headY}
 $('head').style.transform=`rotate(${tilt}deg) translateY(${lift}px)`;
};
