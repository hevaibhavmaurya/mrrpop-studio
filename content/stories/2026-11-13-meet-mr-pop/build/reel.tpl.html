<!doctype html><html><head><meta charset="utf-8"><style>
/* MRR Pop · Meet Mr. Pop — first Reel + Highlight. Same system as the ChatGPT Business Hub v3 reel: theme tokens, burned ≤6-word captions,
   stamps, pixel/wipe transitions, bodyMotion + frame guard. Safe box x 80–850, y 250–1440. No invented numbers (the price slot never lands). */
   Theme tokens: packages/theme/themes/mrrpop-v6/theme.json · Icons: packages/ui/icons/*.svg (injected) */
@font-face{font-family:Inter;src:url(../../../../packages/theme/themes/mrrpop-v6/fonts/Inter-Variable.ttf);font-weight:100 900}
@font-face{font-family:Inter;src:url(../../../../packages/theme/themes/mrrpop-v6/fonts/Inter-Italic-Variable.ttf);font-weight:100 900;font-style:italic}

--lav:#ECE6FF;--limeMist:#F0F9D4;--sky:#E4EEFF;--blush:#FFE5F1;--cream:#FFF4CC;

html,body{width:1080px;height:1920px;overflow:hidden}
body{background:var(--paper);font-family:Inter;color:var(--ink);font-feature-settings:"tnum" 1;position:relative}
.abs{position:absolute}

.glow{position:absolute;border-radius:50%;background-image:radial-gradient(circle,var(--gc,rgba(255,212,59,.75)) 2.6px,transparent 3px);background-size:15px 15px;
  -webkit-mask-image:radial-gradient(circle,#000 0%,rgba(0,0,0,.55) 40%,transparent 70%);mask-image:radial-gradient(circle,#000 0%,rgba(0,0,0,.55) 40%,transparent 70%)}

.slot{display:inline-block;width:.62em;text-align:center}
</style></head><body>
<div id="scenes"></div>

<script>
const DATA=DATAJSON, ICONS=ICONSJSON, B=DATA.beats, MAN=DATA.manifest, VIS=DATA.visemes;
const C=(x,a=0,b=1)=>Math.max(a,Math.min(b,x)),P=(t,s,d)=>C((t-s)/d),eOut=x=>1-Math.pow(1-x,3),eIO=x=>x<.5?4*x*x*x:1-Math.pow(-2*x+2,3)/2;
const eBack=x=>{const c1=1.70158,c3=c1+1;return 1+c3*Math.pow(x-1,3)+c1*Math.pow(x-1,2)};
const $=id=>document.getElementById(id), $$=s=>[...document.querySelectorAll(s)];

const pop=(e,t,s,d=.4)=>{const k=P(t,s,d);e.style.opacity=C(k*3);return k};
const stamp=(id,txt,bg,fg,x,y,fs=44)=>`<div id="${id}" class="stamp" style="left:${x}px;top:${y}px;background:${bg};color:${fg};font-size:${fs}px"><span>${txt}</span></div>`;

// headline text per beat + the accent word (serif italic) per beat
const DISPLAY=B.map(b=>b.text.replace(/from zero/i,'from $0').replace(/Thirty second/i,'30 second').replace(/MRR Pop/,'@getmrrpop'));

const WORDS=B.map((b,i)=>{const w=DISPLAY[i].split(/\s+/);const tot=w.reduce((s,x)=>s+x.length+1,0);let acc=0;return w.map(x=>{const st=b.start+(b.end-b.start)*acc/tot*.92;acc+=x.length+1;return[x,st]})});
const wt=(bi,re)=>{const f=WORDS[bi].find(([w])=>re.test(w));return f?f[1]:bs(bi)};

const SC=[[0,'#ECE6FF','none'],[1,'#20244A','pixel'],[2,'#F0F9D4','wipe'],[3,'#E4EEFF','wipe'],[5,'#FAF9FF','wipe'],[9,'#FFF4CC','wipe'],[{t:T_BOOM},'#20244A','none'],[{t:Math.max(bs(10)-.18,T_BOOM+1.05)},'#ECE6FF','wipe']];
const A=SC.map((s,i)=>!i?0:typeof s[0]==='number'?bs(s[0])-.18:s[0].t); A.push(DATA.duration+5);

const DOTS=(dark)=>`scene dots${dark?' dark':''}`;

const evChip=(id,k,x,y)=>{const e=EV[k];return`<div id="${id}" class="ev" style="left:${x}px;top:${y}px;background:${e[2]};color:${e[3]};border:4px solid ${e[4]};font-size:40px;padding:16px 28px;gap:14px">${e[1]?I(e[1],46):'<b style="font:900 50px/1 Inter;width:46px;text-align:center">≈</b>'} ${e[0]}</div>`};

let H='';
// S0 hook — three tiny app tiles bounce, "?" coins spin, a rent receipt prints out of the middle one
H+=`<div class="${DOTS()}" id="s0" style="background:${SC[0][1]}">
 <div class="glow" style="left:60px;top:430px;width:860px;height:760px;--gc:rgba(106,66,236,.4)"></div>
 ${[['store','#C6F03A',110,560],['chart','#FF6FB5',390,500],['bot','#BBA6FF',670,560]].map((q,i)=>`<div id="tl${i}" class="tile" style="left:${q[2]}px;top:${q[3]}px;background:${q[1]};opacity:1">${I(q[0],110)}<div class="qcoin">?</div></div>`).join('')}
 <div id="rc0" class="card" style="left:410px;top:690px;width:150px;padding:14px 12px;border-radius:10px;box-shadow:5px 5px 0 var(--ink);font:800 22px/1.25 Inter;text-align:center;z-index:-1">SALARY<br><span style="font-size:44px">?</span></div>
 ${stamp('st0','Which small apps pay a salary?','var(--yellow)','var(--ink)',90,930,44)}
</div>`;
// S1 meet (dark) — name card + magnifier sweeping a row of tiny apps
H+=`<div class="${DOTS(1)}" id="s1" style="background:${SC[1][1]}">
 <div id="nm1" class="card" style="left:90px;top:520px;padding:26px 40px 30px;background:var(--violet);color:#fff;border-radius:34px">
   <div style="font:800 22px/1 Inter;letter-spacing:4px;opacity:.85">HOST OF MRR POP</div>

 <div id="row1" class="abs" style="left:90px;top:820px;display:flex;gap:26px">${['coin','rocket','store','trend','tag'].map((n,i)=>`<div class="tile r1" style="position:relative;width:118px;height:118px;border-radius:30px;background:${['#C6F03A','#BBA6FF','#FFD43B','#4C8DF6','#FF6FB5'][i]};box-shadow:6px 6px 0 #000;opacity:1">${I(n,62)}</div>`).join('')}</div>
 <div id="mg1" class="abs" style="left:90px;top:760px;opacity:0;filter:drop-shadow(4px 6px 0 rgba(0,0,0,.35))">${I('magnifier',190)}</div>
 ${stamp('st1','My job','var(--lime)','var(--ink)',90,1030,46)}
</div>`;
// S2 builder → per month (slot-machine price that never lands: we don't make numbers up)
H+=`<div class="${DOTS()}" id="s2" style="background:${SC[2][1]}">
 <div id="bd2" class="card" style="left:90px;top:430px;width:320px;padding:24px;display:grid;justify-items:center;gap:14px;background:#fff">${I('person2',150)}
   <div class="chipui" style="background:var(--lime);font-size:24px">1 person</div></div>
 <div id="win2" class="win" style="left:450px;top:450px;width:400px;height:300px"><div class="bar"><i></i><i></i><i></i><div class="url">my-tiny-app</div></div>
   <div style="padding:26px;display:grid;gap:16px"><div style="height:22px;width:80%;border-radius:8px;background:#ECE6FF"></div><div style="height:22px;width:60%;border-radius:8px;background:#ECE6FF"></div>
   <div id="sh2" class="chipui" style="background:var(--green);color:#fff;font-size:24px;width:max-content">${I('check',26)} Shipped</div></div></div>
 <div id="mo2" class="card" style="left:90px;top:770px;width:700px;height:250px;padding:26px 34px;background:#fff">
   <div style="font:800 24px/1 Inter;letter-spacing:3px;color:var(--muted)">MAKING PER MONTH</div>
   <div id="slot2" style="font:900 170px/1 Inter;letter-spacing:-6px;margin-top:12px;height:170px;overflow:hidden">$???</div></div>
</div>`;
// S3 what we cover — four series stickers pop with the words
// compact stack: starts 70+ px under a 3-line caption, ends 90+ px above Mr. Pop's hair (checked by the layout test)
const SER=[['Revenue Pop','money it makes','coin','#C6F03A','var(--ink)',80,580,-3],['Launch Pop','fresh launches','rocket','#6A42EC','#fff',250,700,2],['Deal Pop','apps that got sold','tag','#FF6FB5','var(--ink)',100,820,-2],['Growth Story','$0 → paying users','trend','#20244A','#fff',230,940,2]];
H+=`<div class="${DOTS()}" id="s3" style="background:${SC[3][1]}">
 ${SER.map((s,i)=>`<div id="sr${i}" class="sticker" style="left:${s[5]}px;top:${s[6]}px;background:${s[3]};color:${s[4]}"><div class="ic">${I(s[2],46)}</div><div><small>${s[1].toUpperCase()}</small><b>${s[0]}</b></div></div>`).join('')}
</div>`;
// S4 four labels
H+=`<div class="${DOTS()}" id="s4" style="background:${SC[4][1]}">
 <div id="n4" class="card" style="left:90px;top:540px;width:470px;height:290px;display:grid;place-items:center;background:var(--yellow);border-radius:40px">
   <div style="text-align:center"><div style="font:900 30px/1 Inter;letter-spacing:4px">A NUMBER</div><div style="font:900 170px/1 Inter;letter-spacing:-6px">$???</div></div></div>
 ${evChip('ev0','pv',90,870)}${evChip('ev1','ca',90,960)}${evChip('ev2','fr',90,1050)}${evChip('ev3','es',90,1140)}
 <div id="trust4" class="chipui" style="position:absolute;left:600px;top:600px;background:#fff;font-size:26px;opacity:0">${I('eye',30)} you decide</div>
</div>`;
// S5 no guessing — crystal ball gets stamped, then a 30-second stopwatch
H+=`<div class="${DOTS()}" id="s5" style="background:${SC[5][1]}">
 <div id="cb5" class="abs" style="left:110px;top:470px;width:360px;height:420px">
   <div style="position:absolute;left:20px;top:0;width:320px;height:320px;border-radius:50%;border:6px solid var(--ink);background:radial-gradient(circle at 35% 30%,#fff 0 14%,#BBA6FF 15% 60%,#6A42EC 100%);display:grid;place-items:center">${I('sparkle',110)}</div>
   <div style="position:absolute;left:60px;top:300px;width:240px;height:90px;border-radius:20px 20px 30px 30px;border:6px solid var(--ink);background:#20244A"></div></div>
 <div id="ng5" class="rubber" style="left:120px;top:640px;background:rgba(255,255,255,.92)">No fluff</div>
 <div id="sw5" class="card" style="left:90px;top:940px;width:340px;height:240px;display:grid;place-items:center;background:#fff">
   <div style="display:flex;align-items:center;gap:20px"><div style="position:relative;width:110px;height:110px;border-radius:50%;border:7px solid var(--ink);background:var(--lime)"><i id="hand5" style="position:absolute;left:47px;top:12px;width:8px;height:44px;border-radius:4px;background:var(--ink);transform-origin:4px 42px"></i></div>
   <div style="font:900 96px/1 Inter;letter-spacing:-4px">0:30</div></div></div>
</div>`;
// S6 boom
H+=`<div class="${DOTS(1)}" id="s6" style="background:${SC[6][1]}">
 <div class="glow" style="left:40px;top:380px;width:1000px;height:900px;--gc:rgba(198,240,58,.55)"></div>
 <div id="bm6" class="abs" style="left:150px;top:520px;width:640px;height:520px;opacity:0">
   <svg viewBox="0 0 640 520" width="640" height="520"><polygon points="${[...Array(24)].map((_,i)=>{const r=i%2?170:300,a=i/24*Math.PI*2-Math.PI/2;return(320+Math.cos(a)*r*1.05)+','+(260+Math.sin(a)*r*.8)}).join(' ')}" fill="#C6F03A" stroke="#1B1838" stroke-width="10" stroke-linejoin="round"/></svg>
   <div style="position:absolute;inset:0;display:grid;place-items:center;font:900 italic 150px/1 Inter;letter-spacing:-6px;color:var(--ink)">BOOM</div></div>
 <div id="conf" class="abs" style="left:0;top:0"></div>
</div>`;
// S7 end card — follow (cursor clicks) + the question
H+=`<div class="${DOTS()}" id="s7" style="background:${SC[7][1]}">
 <div id="fc7" class="card" style="left:90px;top:530px;width:760px;padding:28px 30px;background:#fff">
   <div class="row"><img src="avatar.svg" alt="MRR Pop profile picture (Pop Burst)" style="width:132px;height:132px;border-radius:50%;border:5px solid var(--ink);flex:none">
   <div><div style="font:900 50px/1 Inter;letter-spacing:-1.5px">MRR Pop</div><div style="font:700 28px/1.3 Inter;color:var(--muted)">@getmrrpop · the business behind software</div></div></div>
   <div id="fb7" class="btn" style="margin-top:22px;justify-content:center;width:100%;font-size:34px">Follow</div></div>
 <div id="cur7" class="abs" style="left:700px;top:900px;opacity:0;z-index:5">${I('cursor',90)}</div>
 <div id="q7" class="msg" style="left:90px;top:910px;background:var(--yellow);font-size:40px;max-width:620px;padding:24px 30px">${I('comment',44)} Which small app should I dig into first?</div>
 <div id="cm7" class="chipui" style="position:absolute;left:90px;top:1150px;background:var(--lime);font-size:26px;opacity:0">Comment below</div>
</div>`;
$('scenes').innerHTML=H;
const CONF=[...Array(28)].map((_,i)=>{const a=(-170+i*(160/27))*Math.PI/180;return{dx:Math.cos(a)*(330+((i*53)%220)),dy:Math.sin(a)*(360+((i*71)%240)),r:(i*47)%360,c:['#6A42EC','#C6F03A','#FF6FB5','#FFD43B','#4C8DF6'][i%5],w:14+(i%3)*8,h:8+(i%2)*14}});
$('conf').innerHTML=CONF.map(c=>`<i class="cf" style="position:absolute;left:0;top:0;width:${c.w}px;height:${c.h}px;border-radius:3px;border:2px solid #1B1838;background:${c.c};opacity:0"></i>`).join('');
$('px').innerHTML=[...Array(12*21)].map((_,i)=>`<i style="left:${(i%12)*90}px;top:${Math.floor(i/12)*92}px"></i>`).join('');
const PXR=[...Array(12*21)].map((_,i)=>((i*7919)%251)/251);

// burned captions: ≤6-word chunks, word-by-word
const CHUNKS=[];WORDS.forEach((ws,bi)=>{let cur=[];ws.forEach(([w,st],k)=>{cur.push([w,st]);const end=/[.!?]$/.test(w)||(/[,:]$/.test(w)&&cur.length>=3);if(cur.length>=6||end||k===ws.length-1){CHUNKS.push({bi,words:cur,start:cur[0][1]});cur=[]}})});
let hlChunk=-1;
function headline(t,dark){let ci=0;for(let i=0;i<CHUNKS.length;i++)if(t>=CHUNKS[i].start-.12)ci=i;
 const ch=CHUNKS[ci],bi=ch.bi,el=$('hl');
 if(ci!==hlChunk){hlChunk=ci;const a=(ACCENT[bi]||'').toLowerCase();el.innerHTML=ch.words.map(([w])=>{const clean=w.toLowerCase().replace(/[^a-z0-9]/g,'');return`<span class="w${a&&clean===a?' acc':''}">${w}</span>`}).join('')}
 el.style.color=dark?'#fff':'var(--ink)';
 $$('#hl .w').forEach((s,k)=>{const kk=t<.05?1:P(t,ch.words[k][1]-.05,.18);s.style.opacity=.16+.84*kk;s.style.transform=`translateY(${(1-eOut(kk))*14}px)`;if(s.classList.contains('acc'))s.style.color=dark?'var(--lime)':'var(--violet)'});
 const kb=t<.05?1:P(t,ch.start-.12,.22);el.style.transform=`translateY(${(1-eOut(kb))*22}px)`;el.style.opacity=.3+.7*eOut(kb)}

// character: slots + waist-up framing from the bottom edge; whole-body motion from bodyMotion (injected)
const SLOTS={};for(const g of $$('#rig g[id]')){const m=g.id.match(/^(arms|eyes|brows|mouth|extras|glasses)-(.+)$/);if(m)(SLOTS[m[1]]??=[]).push(m[2])}
function show(slot,v){for(const k of SLOTS[slot]||[]){const e=$(slot+'-'+k);if(e)e.style.display=k===v?'inline':'none'}}
