<div id="scenes"></div>

<script>
const DATA=DATAJSON, ICONS=ICONSJSON, B=DATA.beats, MAN=DATA.manifest, VIS=DATA.visemes;
const C=(x,a=0,b=1)=>Math.max(a,Math.min(b,x)),P=(t,s,d)=>C((t-s)/d),eOut=x=>1-Math.pow(1-x,3),eIO=x=>x<.5?4*x*x*x:1-Math.pow(-2*x+2,3)/2;
const eBack=x=>{const c1=1.70158,c3=c1+1;return 1+c3*Math.pow(x-1,3)+c1*Math.pow(x-1,2)};
const $=id=>document.getElementById(id), $$=s=>[...document.querySelectorAll(s)];
const bs=i=>B[Math.min(i,B.length-1)].start, be=i=>B[Math.min(i,B.length-1)].end;

const stampAnim=(id,t,s,rot)=>{const e=$(id);if(!e)return;const k=P(t,s,.32);e.style.opacity=C(k*4);e.style.transform=`rotate(${rot}deg) scale(${1.6-.6*eBack(k)})`};

 <div id="h0" class="card" style="left:80px;top:540px;width:770px;padding:28px 34px 30px;border-radius:40px;opacity:1">
   <div class="row" style="gap:18px">${ICON(84)}<div><div style="font:900 46px/1 Inter;letter-spacing:-1.5px">$100K Hackathon</div><div style="font:700 22px Inter;color:var(--muted);margin-top:6px">Ship or Die · 30 days · first prize</div></div></div>
   <div class="row" style="margin-top:22px;align-items:flex-end;gap:10px"><div id="n0" class="big" style="color:var(--violet);font-size:164px;letter-spacing:-8px;transform-origin:left bottom">$100,000</div></div>
   <div class="row" style="margin-top:16px;gap:16px"><div id="rv0" style="position:relative;font:900 54px/1 Inter;color:var(--faint);letter-spacing:-1px">REVENUE<i id="ln0" style="position:absolute;left:-6px;top:24px;height:8px;width:0;background:var(--red);border-radius:4px"></i></div>

 ${stamp('st0','Profit','var(--lime)','var(--ink)',430,1000)}

 ${ORG.map((o,i)=>`<div id="og${i}" class="card" style="left:${80+i*0}px;top:${1000+i*0}px;padding:10px 20px 10px 10px;border-radius:999px;z-index:9"><div class="row" style="gap:12px">${i<2?PHOTO(o[0],o[1],66):`<img class="appicon" src="assets/${o[0]}" alt="Higgsfield logo" style="width:66px;height:66px;border-radius:16px;background:#C6F03A">`}<div><div style="font:900 25px Inter">${o[1]}</div><div style="font:700 17px Inter;color:var(--muted)">${o[2]}</div></div></div></div>`).join('')}
 <div id="c1" class="card" style="left:80px;top:1040px;width:500px;padding:16px 28px 18px;border-radius:34px;z-index:10">
   <div class="row" style="align-items:flex-end;gap:14px"><div id="n1" class="big" style="font-size:124px;letter-spacing:-6px">3,300+</div></div>

</div>`;
// S2 brand new apps, zero customers: rule chips
H+=`<div class="${DOTS()}" id="s2" style="background:${SC[2][1]}">
 <div class="glow" style="left:60px;top:470px;width:960px;height:960px;--gc:rgba(61,190,110,.38)"></div>
 <div id="z2" class="card" style="left:80px;top:560px;width:620px;padding:24px 30px;border-radius:34px">
   <div style="font:800 26px Inter;color:var(--muted);letter-spacing:1px;text-transform:uppercase">Customers on day 1</div>
   <div class="big" style="font-size:230px;letter-spacing:-12px;color:var(--violet)">0</div></div>
 ${stamp('st2a','Brand new app','var(--yellow)','var(--ink)',120,1000)}
 ${stamp('st2b','Solo only','#fff','var(--ink)',180,1120)}
 ${stamp('st2c','Nov 16 start','var(--pink)','var(--ink)',150,1240)}
</div>`;
// S3 (dark) the catch: profit formula (rules §13), ad spend flashes red, then TrustMRR checks
H+=`<div class="${DOTS(1)}" id="s3" style="background:${SC[3][1]}">
 <div id="w3" class="win" style="left:80px;top:560px;width:770px">
   <div class="bar"><i style="background:#FF6FB5"></i><i style="background:#FFD43B"></i><i style="background:#C6F03A"></i><div class="url"></div></div>
   ${CROP('assets/rules-profit.png',500,20,1580,300,760)}</div>
 <div id="f3" class="card" style="left:80px;top:790px;width:770px;padding:20px 30px;border-radius:30px">
   <div style="font:900 40px Inter;letter-spacing:-1px">Profit =</div>
   ${[['money received','+'],['refunds','−'],['payment fees','−'],['ad spend','−']].map((x,i)=>`<div class="task" id="fm${i}" style="font-size:38px;${i===3?'color:var(--red)':''}"><b style="width:40px;display:inline-block;text-align:center">${x[1]}</b>${x[0]}</div>`).join('')}</div>
 <div id="tm3" class="card" style="left:80px;top:580px;width:770px;padding:18px 26px;border-radius:26px;z-index:9"><div class="row" style="gap:14px"><img src="assets/trustmrr-icon.png" alt="TrustMRR logo" style="width:60px;height:60px;border-radius:14px"><div><div style="font:900 30px Inter">Every sale checked</div><div style="font:700 22px Inter;color:var(--muted)">payments connected to TrustMRR</div></div><div id="ck3" style="margin-left:auto;opacity:0">${I('verified',56)}</div></div></div>

// S4 real test: customers without buying them
H+=`<div class="${DOTS()}" id="s4" style="background:${SC[4][1]}">
 <div id="p4" class="card" style="left:80px;top:560px;width:560px;padding:22px 28px;border-radius:30px">

 ${stamp('st4','Real test','var(--lime)','var(--ink)',420,1100)}
</div>`;
// S5 tracking the leaderboard: Nov 16 to Dec 16, part 1 of 3
H+=`<div class="${DOTS()}" id="s5" style="background:${SC[5][1]}">
 <div id="cal5" class="card" style="left:80px;top:560px;width:770px;padding:24px 30px;border-radius:34px">
   <div class="row" style="gap:14px">${I('calendar',56)}<div style="font:900 40px Inter;letter-spacing:-1px">Leaderboard watch</div></div>
   <div class="row" style="margin-top:22px;gap:18px;align-items:center"><div style="font:900 64px Inter;letter-spacing:-2px">Nov 16</div>
     <div style="flex:1;height:14px;border-radius:7px;background:var(--lav);border:3px solid var(--ink);overflow:hidden"><i id="bar5" style="display:block;height:100%;width:0;background:var(--violet)"></i></div>
     <div style="font:900 64px Inter;letter-spacing:-2px;color:var(--violet)">Dec 16</div></div></div>
 ${['Part 1 · Launch','Part 2 · Halfway','Part 3 · Winner'].map((x,i)=>`<div id="pt${i}" class="chipui" style="position:absolute;left:80px;top:${860+i*80}px;font-size:26px;padding:12px 20px;opacity:0;background:${i===0?'var(--lime)':'#fff'}">${x}</div>`).join('')}
</div>`;
// S6 end card: YES / NO question + follow
H+=`<div class="${DOTS()}" id="s6" style="background:${SC[6][1]}">
 <div class="glow" style="left:60px;top:540px;width:900px;height:900px;--gc:rgba(106,66,236,.35)"></div>
 <div id="cm6" class="card" style="left:80px;top:560px;width:770px;padding:22px 26px"><div class="row">${ICON(96)}<div><div style="font:900 40px/1.1 Inter;letter-spacing:-1px">Want to enter?</div><div style="font:600 24px Inter;color:var(--muted);margin-top:6px">Comment the word below. I'll send you the link</div></div></div>
   <div class="row" style="margin-top:16px;gap:14px">${I('comment',44)}<span class="chipui" style="font-size:40px;padding:14px 34px;background:var(--lime);letter-spacing:4px">LINK</span></div></div>
 <div id="fl6" class="card" style="left:80px;top:860px;width:700px;padding:22px 24px"><div class="row"><img src="avatar.svg" alt="MRR Pop profile picture" style="width:132px;height:132px;border-radius:50%;border:5px solid var(--ink);flex:none"><div><div style="font:900 36px Inter;letter-spacing:-1px">@getmrrpop</div><div style="font:600 22px Inter;color:var(--muted);margin-top:4px">The business behind software</div></div></div>
   <div id="folBtn" class="btn" style="margin-top:18px;font-size:30px;padding:14px 30px">Follow MRR Pop</div></div>
 <div id="cur6" class="abs" style="left:760px;top:1320px;opacity:0;z-index:9">${I('cursor',84)}</div>
 <div id="conf6" class="abs" style="left:0;top:0;width:1080px;height:1920px"></div>
</div>`;
$('scenes').innerHTML=H;

const CONF=[...Array(26)].map((_,i)=>{const a=(-170+i*(160/25))*Math.PI/180;return{dx:Math.cos(a)*(330+((i*53)%220)),dy:Math.sin(a)*(360+((i*71)%240)),r:(i*47)%360,c:['#6A42EC','#C6F03A','#FF6FB5','#FFD43B','#4C8DF6'][i%5],w:14+(i%3)*8,h:8+(i%2)*14}});
$('conf6').innerHTML=CONF.map(c=>`<i class="cf" style="position:absolute;left:0;top:0;width:${c.w}px;height:${c.h}px;border-radius:3px;border:2px solid #1B1838;background:${c.c};opacity:0"></i>`).join('');
$('px').innerHTML=[...Array(12*21)].map((_,i)=>`<i style="left:${(i%12)*90}px;top:${Math.floor(i/12)*92}px"></i>`).join('');
const PXR=[...Array(12*21)].map((_,i)=>((i*7919)%251)/251);

// headline words with timing
const WORDS=B.map((b,i)=>{const w=DISPLAY[i].split(/\s+/);const tot=w.reduce((s,x)=>s+x.length+1,0);let acc=0;return w.map(x=>{const st=b.start+(b.end-b.start)*acc/tot*.92;acc+=x.length+1;return[x,st]})});
const CHUNKS=[];WORDS.forEach((ws,bi)=>{let cur=[];ws.forEach(([w,st],k)=>{cur.push([w,st]);const sent=/[.!?]$/.test(w),comma=/,$/.test(w)&&cur.length>=5;if(sent||comma||cur.length>=11||k===ws.length-1){CHUNKS.push({bi,words:cur,start:cur[0][1]});cur=[]}})});
let hlChunk=-1;
function headline(t){let ci=0;for(let i=0;i<CHUNKS.length;i++)if(t>=CHUNKS[i].start-.12)ci=i;
 const ch=CHUNKS[ci],bi=ch.bi,el=$('hl');
 if(ci!==hlChunk){hlChunk=ci;const a=(ACCENT[bi]||'').toLowerCase();el.innerHTML=ch.words.map(([w])=>{const clean=w.toLowerCase().replace(/[^a-z0-9]/g,'');return`<span class="w${a&&clean===a?' acc':''}">${w}</span>`}).join('')}
 const dark=DARKBEAT[bi];el.style.color=dark?'#fff':'var(--ink)';
 $$('#hl .w').forEach((s,k)=>{const kk=P(t,ch.words[k][1]-.05,.18);s.style.opacity=bi===0?1:.16+.84*kk;s.style.transform=`translateY(${(1-eOut(kk))*14}px)`;if(s.classList.contains('acc'))s.style.color=dark?'var(--lime)':'var(--violet)'});
