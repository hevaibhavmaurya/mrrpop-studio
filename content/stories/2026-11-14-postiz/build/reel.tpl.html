H+=`<div class="${DOTS(1)}" id="s3" style="background:${SC[3][1]}">
 <div id="w3" class="win" style="left:80px;top:560px;width:770px">
   <div class="bar"><i style="background:#FF6FB5"></i><i style="background:#FFD43B"></i><i style="background:#C6F03A"></i><div class="url">github.com/gitroomhq/postiz-app</div></div>

H+=`<div class="${DOTS()}" id="s4" style="background:${SC[4][1]}">

H+=`<div class="${DOTS()}" id="s6" style="background:${SC[6][1]}">

const WORDS=B.map((b,i)=>{const w=DISPLAY[i].split(/\s+/);const tot=w.reduce((s,x)=>s+x.length+1,0);let acc=0;return w.map(x=>{const st=b.start+(b.end-b.start)*acc/tot*.92;acc+=x.length+1;return[x,st]})});
const CHUNKS=[];WORDS.forEach((ws,bi)=>{let cur=[];ws.forEach(([w,st],k)=>{cur.push([w,st]);const sent=/[.!?]$/.test(w),comma=/,$/.test(w)&&cur.length>=5;if(sent||comma||cur.length>=11||k===ws.length-1){CHUNKS.push({bi,words:cur,start:cur[0][1]});cur=[]}})});

 const kb=P(t,ch.start-.12,.22);el.style.transform=`translateY(${(1-eOut(kb))*22}px)`;el.style.opacity=.3+.7*eOut(kb)}

// character
const SLOTS={};for(const g of $$('#rig g[id]')){const m=g.id.match(/^(arms|eyes|brows|mouth|extras|glasses|front)-(.+)$/);if(m)(SLOTS[m[1]]??=[]).push(m[2])}
function show(slot,v){for(const k of SLOTS[slot]||[]){const e=$(slot+'-'+k);if(e)e.style.display=k===v?'inline':'none'}}
function setChar(pose,expr,viseme,blink){const p=MAN.poses[pose]||{},x=MAN.expressions[expr]||{};const s={...MAN.defaults,...p,...x};
 if(viseme&&viseme!=='X')s.mouth=viseme;if(blink&&['open','up','side'].includes(s.eyes))s.eyes='closed';
 for(const k of ['arms','eyes','brows','mouth','extras','glasses','front'])show(k,s[k])}
// Face: follow the voice engine's cues (voice/voiceover.face.json, same styles as voices.json → expressive.*.face),
// so every expression + pose change lands on the beat whose emotion it was voiced with.
const FC=DATA.face;
function faceCues(){if(!FC||!FC.expressions)return null;
 const at=(list,t)=>{let v=list[0].value;for(const c of list)if(t>=c.start-1e-3)v=c.value;return v};
 const ts=[...new Set([0,...FC.expressions.map(c=>c.start),...FC.poses.map(c=>c.start)])].sort((a,b)=>a-b);
 return ts.map(t=>[t,at(FC.poses,t),at(FC.expressions,t)])}
const ST=[faceCues()||[[0,'pointing','shocked'],[bs(1),'celebrating','star-struck'],[bs(2),'explaining','grin'],[bs(3),'thinking','curious'],[bs(4),'explaining','serious'],[bs(5),'explaining','grin'],[bs(6),'waving','grin']]];
const SCALE=1.12, PXU=0.7683*SCALE, WAIST=940;
const POS=[650,650,650,650,650,650,650];
const scy=1920-WAIST*PXU;
const FLAT=ST.flat();
let ARMX=null;
function armReach(){ARMX={};for(const g of $$('#rig g[id^="arms-"]')){const d=g.style.display;g.style.display='inline';const b=g.getBBox();g.style.display=d;ARMX[g.id.slice(5)]=[b.x,b.x+b.width]}}
const SHOWN=q=>{const x=q[2],p=q[1],o=[p];if(x==='laughing'||x==='annoyed')o.push('belly-laugh','laugh-point');if(x==='shocked')o.push('recoil');if(['cool','cheeky','skeptical'].includes(x))o.push('hands-on-hips');if(x==='nervous')o.push('clap');return o};
function xLim(q){if(!ARMX)armReach();let l=150,r=450;
 const ex=(MAN.expressions[q[2]]||{}).extras;if(ex&&ex!=='none'){r=Math.max(r,580);l=Math.min(l,100)}
 for(const p of SHOWN(q)){const a=(MAN.poses[p]||{}).arms,e=ARMX[a];if(e){l=Math.min(l,e[0]);r=Math.max(r,e[1])}}
 const m=170,k=PXU*1.03;
 return [48-(l-m)*k, 1080-48-(r+m)*k]}

window.render=function(t){
 let si=0;for(let i=0;i<SC.length;i++)if(t>=A[i])si=i;
 let pxOn=null;SC.forEach((s,i)=>{if(s[2]==='pixel'&&t>=A[i]-.4&&t<A[i]+.45)pxOn=i});
 SC.forEach((s,i)=>{const el=$('s'+i),st=A[i];
  const incoming=i===si+1&&s[2]==='wipe'&&t>=st-.35;
  el.style.display=(i===si||incoming)?'block':'none';el.style.zIndex=i;
  if(s[2]==='wipe'&&i>0&&(incoming||i===si)){const k=eIO(P(t,st-.35,.45));el.style.clipPath=k>=1?'none':`polygon(${(1-k)*160-60}% 0,100% 0,100% 100%,${(1-k)*160-40}% 100%)`}else el.style.clipPath='none'});
 $$('#px i').forEach((q,k)=>{if(pxOn===null){q.style.opacity=0;return}const st=A[pxOn];const inK=P(t,st-.4+PXR[k]*.3,.05),outK=P(t,st+PXR[(k*13)%PXR.length]*.35,.05);q.style.background=SC[pxOn][1];q.style.opacity=inK*(1-outK)});

 // S0 hook: $417K counts up, FREE TO HOST slams in
 {const h=$('h0'),d=be(0)-bs(0);h.style.transform=`scale(${1+.05*Math.sin(P(t,0,.6)*Math.PI)}) rotate(${-1.5+Math.sin(t*1.3)*.5}deg)`;
  stampAnim('st0',t,.35,-7);
  const kn=eOut(P(t,d*.45,1.0)),n=$('n0');n.textContent='$'+Math.round(FACT.mrrK*Math.max(kn,t<d*.45?1:0))+'K';n.style.transform=`scale(${1+.1*Math.sin(P(t,d*.45,.5)*Math.PI)})`;
  const ev=$('ev0'),ke=pop(ev,t,d*.6,.3);ev.style.transform=`translateY(${(1-eOut(ke))*20}px)`}
 // S1 FREE.
 {const b1=bs(1);const f=$('fr1'),kf=pop(f,t,b1-.05,.3);f.style.transform=`scale(${1.8-.8*eBack(kf)}) rotate(${-4+Math.sin(t*3)*1.5}deg)`;
  const q=$('q1'),kq=pop(q,t,b1+.35,.4);q.style.transform=`translateY(${(1-eBack(kq))*160}px) rotate(1deg)`}
 // S2 site, channel icons fly in, agents light up
 {const b2=bs(2),d=be(2)-b2;const w=$('w2'),kw=pop(w,t,b2-.05,.4);w.style.transform=`translateY(${(1-eBack(kw))*160}px) rotate(-1deg)`;
  const fd=$('fd2'),kd=pop(fd,t,b2+.3,.35);fd.style.transform=`translateX(${(1-eBack(kd))*160}px) rotate(3deg)`;
  
  SOCIALS.forEach((_,i)=>{const e=$('so'+i),s=b2+d*.18+i*.07,k=eBack(P(t,s,.45));e.style.opacity=t>s?1:0;
   const [x1,y1]=SOCPOS[i],x0=430,y0=760;const bob=Math.sin(t*3+i)*4;
   e.style.transform=`translate(${x0+(x1-x0)*k}px,${y0+(y1-y0)*k+bob}px) rotate(${(1-C(k))*(i%2?-40:40)}deg) scale(${.4+.6*C(k)})`});
  const ag=$('ag2'),ka=pop(ag,t,b2+d*.58,.35);ag.style.transform=`translateY(${(1-eBack(ka))*120}px)`;
  AGENTS.forEach((_,i)=>{const e=$('ag'+i),k=pop(e,t,b2+d*.62+i*.1,.3);e.style.transform=`scale(${.3+.7*eBack(k)}) rotate(${Math.sin(t*4+i)*4}deg)`})}
 // S3 GitHub
 {const b3=bs(3);const w=$('w3'),kw=pop(w,t,b3-.05,.4);w.style.transform=`translateY(${(1-eBack(kw))*160}px) rotate(1deg)`;
  const n=$('n3'),kn=eOut(P(t,b3+.2,.9));n.textContent=(41.6*kn).toFixed(1)+'k';
  stampAnim('st3',t,b3+.5,-6)}
 // S4 TrustMRR + 12,304
 {const b4=bs(4);const w=$('w4'),kw=pop(w,t,b4-.05,.4);w.style.transform=`translateY(${(1-eBack(kw))*160}px) rotate(-1deg)`;
  const c=$('c4'),kc=pop(c,t,b4+.4,.35);c.style.transform=`scale(${.6+.4*eBack(kc)}) rotate(1deg)`;
  const n=Math.round(FACT.subs*eOut(P(t,b4+.5,1.4)));$('n4').textContent=n.toLocaleString('en-US');
  const ev=$('ev4'),ke=pop(ev,t,b4+1.5,.3);ev.style.transform=`translateY(${(1-eOut(ke))*20}px)`}
 // S5 server chores vs Cloud
 {const b5=bs(5),d=be(5)-b5;const s=$('sv5'),ks=pop(s,t,b5-.05,.35);s.style.transform=`translateY(${(1-eBack(ks))*140}px) rotate(-1deg)`;
  $$('#sv5 .task').forEach((e,i)=>{const k=pop(e,t,b5+.15+i*.14,.25);e.style.transform=`translateX(${(1-eOut(k))*-60}px)`});
  rubberAnim('r5',t,b5+d*.5,-12);
  const cl=$('cl5'),kc=pop(cl,t,b5+d*.62,.4);cl.style.transform=`translateY(${(1-eBack(kc))*180}px) rotate(2deg)`;
  const ev=$('ev5'),ke=pop(ev,t,b5+d*.75,.3);ev.style.transform=`translateY(${(1-eOut(ke))*20}px)`}
 // S6 end card
 {const b6=bs(6);
  const cm=$('cm6'),kc=pop(cm,t,b6,.4);cm.style.transform=`translateY(${(1-eBack(kc))*160}px) rotate(-1.5deg)`;
  const fl=$('fl6'),kf=pop(fl,t,b6+.9,.4);fl.style.transform=`translateY(${(1-eBack(kf))*160}px) rotate(1deg)`;
  const cur=$('cur6'),kx=P(t,b6+1.5,.6);cur.style.opacity=t>b6+1.4?1:0;cur.style.transform=`translate(${-eIO(kx)*480}px,${-eIO(kx)*250}px) scale(${t>b6+2.1&&t<b6+2.25?.85:1})`;
  const fb=$('folBtn'),fd=t>b6+2.2;fb.textContent=fd?'Following ✓':'Follow MRR Pop';fb.style.background=fd?'var(--lime)':'var(--violet)';fb.style.color=fd?'var(--ink)':'#fff';
  $$('#conf6 .cf').forEach((e,i)=>{const q=CONF[i];const kk=P(t,b6+2.2+i*.01,1.3);e.style.opacity=kk>0?1-P(t,b6+3.2,.3):0;e.style.transform=`translate(${420+q.dx*eOut(kk)*.8}px,${1080+q.dy*eOut(kk)*.8+kk*kk*600}px) rotate(${q.r*kk*3}deg)`})}

 headline(t);
 // source line follows the beat
 {let bi=0;for(let i=0;i<B.length;i++)if(t>=bs(i)-.18)bi=i;const s=SRC[bi],el=$('src');
  if(s){$('srcB').textContent=s[0];$('srcD').textContent=s[1];$('srcD').style.display=s[1]?'':'none'}
  el.style.opacity=s?C(P(t,.6,.3)):0}

 // character: waist up from the bottom edge
 let s=FLAT[0];for(const q of FLAT)if(t>=q[0])s=q;
 const fi=Math.floor(t*VIS.fps),vis=VIS.frames[fi]||'X',talk=vis!=='X';
 const en0=window.energyAt&&VIS.energy?energyAt(VIS.energy,VIS.fps,t):(talk?.6:0);
 const qi=FLAT.indexOf(s),prevQ=qi>0?FLAT[qi-1]:null;
 const M=window.bodyMotion?bodyMotion({t,energy:en0,talking:talk,expression:s[2],pose:s[1],since:t-s[0],prevExpression:prevQ&&prevQ[2],prevPose:prevQ&&prevQ[1]}):null;
 setChar(M?M.pose:s[1],s[2],vis,(t%3.4)>3.27);
 const px0=POS[Math.max(0,si-1)];let x=px0+(POS[si]-px0)*eIO(P(t,A[si],.5));
 {const L1=xLim(s),L0=prevQ?xLim(prevQ):L1,nq=FLAT[qi+1],w=eIO(P(t,s[0],.45));
  let lo=Math.max(L0[0],L1[0]),hi=Math.min(L0[1],L1[1]);lo+=(L1[0]-lo)*w;hi+=(L1[1]-hi)*w;
  if(nq){const N=xLim(nq),a=eIO(P(t,nq[0]-.5,.5));lo+=(Math.max(lo,N[0])-lo)*a;hi+=(Math.min(hi,N[1])-hi)*a}
  x=Math.min(Math.max(x,lo),hi)}
 let dy=(1-eBack(P(t,-.3,.6)))*700,sq=1;
 for(const q of FLAT){const kk=(t-q[0])/.5;if(kk>0&&kk<1){dy-=(.5-.5*Math.cos(kk*Math.PI*2))*28;sq=1+Math.sin(kk*Math.PI*2)*.02}}
 const sway=M?0:Math.sin(t*1.6)*1.2; if(!M)dy+=Math.sin(t*2.2)*6;
 $('char').style.transform=`translate(${x}px,${scy+dy}px) scale(${SCALE/sq},${SCALE*sq}) rotate(${sway}deg)`;
 const en=VIS.energy?(VIS.energy[fi]||0):(talk?.7:0);
 const nod=en>.05?(Math.sin(t*7.3)*3+Math.sin(t*3.1)*2)*(.5+en*.7):Math.sin(t*1.4)*1.5;
 let lift=-Math.abs(Math.sin(t*9))*4*en,tilt=nod;
 if(M){const T=motionTransforms(M,MP_HIP,MP_FEET,MP_WAIST||undefined);
  $('root')?.setAttribute('transform',T.root);$('legs')?.setAttribute('transform',T.legs);$('upper')?.setAttribute('transform',T.upper);$('armsrig')?.setAttribute('transform',T.arms);
  tilt=M.headTilt;lift=T.headY}
 $('head').style.transform=`rotate(${tilt}deg) translateY(${lift}px)`;
};
window.render(0);
