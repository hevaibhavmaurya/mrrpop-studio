 [[bs(4),'explaining','smile'],[bs(4)+2.2,'pointing-side','cheeky'],[bs(4)+4.4,'thumbs-up','grin']],

const POS=[640,650,640,650,650,660,640,650];

 let si=0;for(let i=0;i<SC.length;i++)if(t>=A[i])si=i;

 $$('#px i').forEach((q,k)=>{if(pxOn===null){q.style.opacity=0;return}const st=A[pxOn];const inK=P(t,st-.4+PXR[k]*.3,.05),outK=P(t,st+PXR[(k*13)%PXR.length]*.35,.05);q.style.background=SC[pxOn][1];q.style.opacity=inK*(1-outK)});

 // S0
 {const n=$('n0');n.style.transform=`scale(${1+.06*Math.sin(P(t,0,.6)*Math.PI)}) rotate(${-2+Math.sin(t*1.3)*.6}deg)`;
  $$('.orb').forEach((o,i)=>{const k=P(t,.6+i*.16,.4);o.style.opacity=C(k*3);const a=(i/6)*Math.PI*2+t*.35;o.style.left=(500+Math.cos(a)*420-50)+'px';o.style.top=(890+Math.sin(a)*290-50)+'px';o.style.transform=`scale(${.4+.6*eBack(k)})`});
  const c=$('ch0'),kc=pop(c,t,1.0,.35);c.style.transform=`scale(${.4+.6*eBack(kc)}) translateY(${Math.sin(t*2.2)*8}px) rotate(${Math.sin(t*1.6)*4}deg)`;
  stampAnim('st0',t,1.7,-6);const ev=$('ev0'),k=pop(ev,t,2.0,.3);ev.style.transform=`translateY(${(1-eOut(k))*20}px)`}
 // S1
 {const b1=bs(1),b2=bs(2);const w=$('w1'),kw=pop(w,t,b1,.4);w.style.transform=`translateY(${(1-eBack(kw))*160}px) rotate(${-3+(1-kw)*-6}deg)`;
  const w2=$('w1b'),k2=pop(w2,t,b1+.25,.4);w2.style.transform=`translateY(${(1-eBack(k2))*160}px) rotate(3deg)`;
  $$('.walk').forEach((e,i)=>{const kk=P(t,b1+.4+i*.18,.9);e.style.opacity=kk>0?(kk<.85?1:1-(kk-.85)*6.6):0;e.style.transform=`translate(${eIO(kk)*360}px,${-Math.sin(kk*Math.PI)*90-i*20}px) scale(${1-kk*.4})`});
  const r=$('r1'),kr=P(t,b1+.9,.25);r.style.opacity=C(kr*4)*(1-P(t,b2-.1,.2));r.style.transform=`rotate(-8deg) scale(${1.8-.8*eOut(kr)})`;
  const you=$('you'),ky=P(t,b2+.45,.3),on=ky>0;you.style.borderColor=on?'#1B1838':'';you.style.borderStyle=on?'solid':'dashed';you.style.background=on?'#C6F03A':'';you.style.color=on?'#1B1838':'';you.style.transform=`scale(${1+.12*Math.sin(ky*Math.PI)})`;$('youTxt').textContent=on?'Your store ✓':'Your store?';
  const m=$('mg'),km=P(t,b2-.05,.6);m.style.opacity=C(km*4)*(1-P(t,bs(3)-.35,.2));m.style.transform=`translate(${(1-eOut(km))*-300}px,${Math.sin(km*Math.PI)*-40}px) rotate(${(1-km)*-30}deg)`;
  stampAnim('st1',t,b2+.1,-4);pop($('tg1'),t,b1+.5,.3)}
 // S2
 {const b3=bs(3);const c=$('cal'),kc=pop(c,t,b3,.4);c.style.transform=`rotate(${-8+(1-kc)*-20}deg) scale(${.4+.6*eBack(kc)})`;
  const a=$('app'),ka=pop(a,t,b3+1.1,.45);a.style.transform=`translateY(${(1-eBack(ka))*200}px) rotate(${2*(1-ka)+1}deg)`;
  stampAnim('st2',t,b3+1.5,8);
  $$('.spk').forEach((s,i)=>{const k=pop(s,t,b3+1.4+i*.15,.3);s.style.transform=`scale(${(.3+.7*eBack(k))*(1+.12*Math.sin(t*4+i))}) rotate(${t*40*(i%2?1:-1)}deg)`});
  $$('#conf .cf').forEach((e,i)=>{const q=CONF[i];const kk=P(t,b3+1.15+i*.01,1.4);e.style.opacity=kk>0?1-P(t,b3+2.4,.35):0;e.style.transform=`translate(${520+q.dx*eOut(kk)}px,${960+q.dy*eOut(kk)+kk*kk*620}px) rotate(${q.r*kk*3}deg)`})}
 // S3
 {const b4=bs(4);const w=$('w3'),kw=pop(w,t,b4,.4);w.style.transform=`translateY(${(1-eBack(kw))*200}px) rotate(${-1.5+(1-kw)*-4}deg)`;

  const cb=$('claimBtn'),done=t>b4+1.1;cb.textContent=done?'Claimed ✓':'Claim';cb.style.background=done?'var(--lime)':'var(--violet)';cb.style.color=done?'var(--ink)':'#fff';cb.style.transform=`scale(${1+.14*Math.sin(P(t,b4+1.05,.3)*Math.PI)})`;
  $('vb').style.transform=`scale(${eBack(P(t,b4+2.2,.4))}) rotate(${(1-P(t,b4+2.2,.5))*-90}deg)`;
  $$('.r3').forEach((r,i)=>{const k=pop(r,t,b4+3.6+i*.3,.35);r.style.transform=`translateX(${(1-eBack(k))*90}px)`;r.querySelector('.np').style.transform=`scale(${1+.3*Math.sin(P(t,b4+3.9+i*.3,.4)*Math.PI)})`});
  stampAnim('s3a',t,b4+.9,5);stampAnim('s3b',t,b4+2.2,-4);stampAnim('s3c',t,b4+3.7,4);pop($('tg3'),t,b4+.6,.3)}
 // S4
 {const b5=bs(5),b6=bs(6);stampAnim('st4',t,b5,-3);const ws=[b6,b6+.48,b6+.96];
  ['t0','t1','t2'].forEach((id,i)=>{const e=$(id),k=pop(e,t,ws[i]-.08,.4);e.style.transform=`translateY(${(1-eBack(k))*180}px) rotate(${[-2,2,-1][i]}deg)`});
  $('spark').style.strokeDashoffset=470*(1-eOut(P(t,ws[0]+.15,.8)));
  $$('.cb').forEach((c,i)=>c.style.transform=`scaleY(${eBack(P(t,ws[1]+.1+i*.08,.4))})`);
  $$('.tp').forEach((c,i)=>{const k=P(t,ws[2]+.15+i*.12,.3);c.style.opacity=C(k*3);c.style.transform=`scale(${.4+.6*eBack(k)})`});pop($('tg4'),t,b5+.3,.3)}
 // S5
 {const b7=bs(7);const w=$('w5'),kw=pop(w,t,b7,.45);w.style.transform=`translateY(${(1-eBack(kw))*220}px) rotate(-1.5deg)`;
  const m0=$('m0'),k0=pop(m0,t,b7+1.0,.35);m0.style.transform=`translateY(${(1-eBack(k0))*40}px)`;
  $('typ').style.opacity=(t>b7+1.9&&t<b7+3.0)?1:0;$$('.td').forEach((d,i)=>d.style.transform=`translateY(${Math.sin(t*9-i)*6}px)`);
  const m1=$('m1'),k1=pop(m1,t,b7+3.0,.35);m1.style.transform=`translateY(${(1-eBack(k1))*40}px)`;
  const q=$('qr'),kq=pop(q,t,b7+4.1,.35);q.style.transform=`scale(${.4+.6*eBack(kq)})`;
  stampAnim('st5',t,b7+.5,7);pop($('tg5'),t,b7+.8,.3)}
 // S6
 {const b8=bs(8),b9=bs(9);stampAnim('st6',t,b8-.05,-4);
  [b9+.05,b9+1.3,b9+1.85].forEach((s,i)=>{const e=$('c'+i),k=pop(e,t,s,.35);e.style.transform=`translateX(${(1-eBack(k))*-140}px) rotate(${[-1,1,-.5][i]}deg)`});
  const r=$('r6'),kr=P(t,b9+2.4,.25);r.style.opacity=C(kr*4);r.style.transform=`rotate(-10deg) scale(${1.8-.8*eOut(kr)})`}
 // S7
 {const b10=bs(10);const lg=$('lg'),kl=pop(lg,t,b10-.1,.45);lg.style.transform=`scale(${.5+.5*eBack(kl)}) translateY(${-Math.abs(Math.sin(t*3))*8*P(t,b10+.8,.4)}px)`;lg.style.transformOrigin='left center';
  const cm=$('cm7'),kc=pop(cm,t,b10+.4,.4);cm.style.transform=`translateY(${(1-eBack(kc))*160}px) rotate(-1.5deg)`;
  const fl=$('fl7'),kf=pop(fl,t,b10+1.3,.4);fl.style.transform=`translateY(${(1-eBack(kf))*160}px) rotate(1deg)`;
  const cur=$('cur7'),kx=P(t,b10+1.8,.6);cur.style.opacity=t>b10+1.7?1:0;cur.style.transform=`translate(${-eIO(kx)*150}px,${-eIO(kx)*180}px) scale(${t>b10+2.4&&t<b10+2.55?.85:1})`;
  const fb=$('folBtn'),fd=t>b10+2.5;fb.textContent=fd?'Following ✓':'Follow';fb.style.background=fd?'var(--lime)':'var(--violet)';fb.style.color=fd?'var(--ink)':'#fff';
  $$('#conf7 .cf').forEach((e,i)=>{const q=CONF[i];const kk=P(t,b10+2.5+i*.01,1.3);e.style.opacity=kk>0?1-P(t,b10+3.5,.3):0;e.style.transform=`translate(${520+q.dx*eOut(kk)*.8}px,${1080+q.dy*eOut(kk)*.8+kk*kk*600}px) rotate(${q.r*kk*3}deg)`})}

 headline(t);

 // character: waist-up from the bottom edge
 let s=ST[si][0];for(const q of ST[si])if(t>=q[0])s=q;

 setChar(s[1],s[2],vis,(t%3.4)>3.27);
 const px0=POS[Math.max(0,si-1)],x=px0+(POS[si]-px0)*eIO(P(t,A[si],.5));
 let dy=(1-eBack(P(t,-.3,.6)))*700,sq=1;
 for(const q of ST[si]){const kk=(t-q[0])/.4;if(kk>0&&kk<1){dy-=Math.sin(kk*Math.PI)*34;sq=1+Math.sin(kk*Math.PI*2)*.03}}
 dy+=Math.sin(t*2.2)*6;const sway=Math.sin(t*1.6)*1.2+(talk?Math.sin(t*6.1)*.8:0);
 $('char').style.transform=`translate(${x}px,${scy+dy}px) scale(${SCALE/sq},${SCALE*sq}) rotate(${sway}deg)`;
 const en=VIS.energy?(VIS.energy[fi]||0):(talk?.7:0); // voice energy drives how much he moves
 const nod=en>.05?(Math.sin(t*7.3)*3+Math.sin(t*3.1)*2)*(.5+en*.7):Math.sin(t*1.4)*1.5;
 $('head').style.transform=`rotate(${nod}deg) translateY(${-Math.abs(Math.sin(t*9))*4*en}px)`;
};
