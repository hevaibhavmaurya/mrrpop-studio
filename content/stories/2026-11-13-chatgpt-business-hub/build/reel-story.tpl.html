.tag{position:absolute;padding:7px 12px;border:3px solid var(--ink);border-radius:999px;background:var(--yellow);font:800 17px/1 Inter;letter-spacing:1.5px;text-transform:uppercase;opacity:0}

.win{position:absolute;background:#fff;border:5px solid var(--ink);border-radius:30px;box-shadow:10px 10px 0 rgba(27,24,56,.9);overflow:hidden;opacity:0}
.win .bar{display:flex;align-items:center;gap:10px;padding:16px 20px;border-bottom:4px solid var(--ink);background:var(--paper)}

.chipui{display:inline-flex;align-items:center;gap:8px;padding:8px 14px;border-radius:999px;border:3px solid var(--ink);font:800 18px/1 Inter;letter-spacing:1px;text-transform:uppercase;white-space:nowrap}
.src{position:absolute;left:80px;top:1380px;display:flex;align-items:center;gap:10px;padding:10px 16px;border-radius:999px;background:rgba(255,255,255,.88);border:3px solid var(--ink);font:600 20px/1 Inter;z-index:31}
.src b{font-weight:800}
.ev{position:absolute;display:inline-flex;align-items:center;gap:10px;padding:10px 18px;border-radius:999px;font:700 24px/1 Inter;white-space:nowrap;opacity:0}
#char{position:absolute;left:0;top:0;width:461px;height:1060px;transform-origin:0 0;z-index:40}

#px{position:absolute;inset:0;z-index:25;pointer-events:none}

const C=(x,a=0,b=1)=>Math.max(a,Math.min(b,x)),P=(t,s,d)=>C((t-s)/d),eOut=x=>1-Math.pow(1-x,3),eIO=x=>x<.5?4*x*x*x:1-Math.pow(-2*x+2,3)/2;

// 0 hook 1.2B · 1 in the answer? · 2 Maya · 3 soy candle ask · 4 Not once · 5 launch · 6 claim + blue check

const DISPLAY=B.map(b=>b.text.replace(/one point two billion/i,'1.2 billion').replace('November tenth','November 10th'));

 <div class="glow" style="left:90px;top:500px;width:900px;height:900px;--gc:rgba(106,66,236,.45)"></div>
 <div id="n0" class="card" style="left:150px;top:740px;width:640px;height:300px;display:grid;place-items:center;border-radius:40px;opacity:1">

 ${stamp('st0','Every week','var(--yellow)','var(--ink)',150,640)}

</div>`;

H+=`<div class="${DOTS(1)}" id="s1" style="background:${SC[1][1]}">
 <div id="q1" class="card" style="left:80px;top:700px;width:770px;padding:26px 30px;border-radius:32px">
   <div class="row">${I('chat',84)}<div><div style="font:900 40px Inter">ChatGPT</div><div style="font:600 26px Inter;color:var(--muted)">answering 1.2B people a week</div></div></div>
   ${ANS(['Shop A','Shop B','Your shop?'],'you1')}</div>
 <div id="mg1" class="abs" style="left:640px;top:1000px;opacity:0;z-index:8">${I('magnifier',170)}</div>
 <div class="tag" id="tg1" style="left:80px;top:655px">Illustration</div>
</div>`;
// S2 Maya's candle shop → the soy-candle question → NOT ONCE
H+=`<div class="${DOTS()}" id="s2" style="background:${SC[2][1]}">
 <div id="w2" class="win" style="left:80px;top:550px;width:420px;height:370px">
   <div class="bar"><i style="background:#FF6FB5"></i><i style="background:#FFD43B"></i><i style="background:#C6F03A"></i><div class="url">mayascandles.shop</div></div>

 <div id="mn" class="abs" style="left:540px;top:590px;opacity:0;text-align:center"><div style="width:200px;height:200px;border-radius:50%;background:#fff;border:5px solid var(--ink);display:grid;place-items:center;box-shadow:8px 8px 0 var(--ink)">${I('person4',150)}</div><div style="margin-top:12px;font:900 34px Inter">Maya</div></div>

 <div class="glow" style="left:140px;top:500px;width:860px;height:860px"></div>
 <div id="cal" class="abs" style="left:96px;top:540px;width:230px;height:230px;opacity:0">${I('calendar',230)}<div class="abs" style="left:0;top:98px;width:230px;text-align:center;font:900 30px/1 Inter;letter-spacing:3px">NOV</div><div class="abs" style="left:0;top:132px;width:230px;text-align:center;font:900 76px/1 Inter;letter-spacing:-3px">10</div></div>

 ${stamp('st3','New','var(--pink)','var(--ink)',620,680)}
 ${[0,1,2].map(i=>`<div class="abs spk" id="sp${i}" style="left:${[70,900,560][i]}px;top:${[1150,860,640][i]}px;opacity:0">${I('sparkle',[70,56,46][i])}</div>`).join('')}
 <div id="conf" class="abs" style="left:0;top:0;width:1080px;height:1920px"></div>
</div>`;
// S4 claim → blue check → prices + stock
H+=`<div class="${DOTS()}" id="s4" style="background:${SC[4][1]}">
 <div id="w4" class="win" style="left:80px;top:590px;width:770px;height:450px">
   <div class="bar"><i style="background:#FF6FB5"></i><i style="background:#FFD43B"></i><i style="background:#C6F03A"></i><div class="url">chatgpt · business hub</div></div>

 ${stamp('st5','3 numbers','var(--ink)','#fff',80,540)}

 <div class="tag" id="tg5" style="left:420px;top:556px">Sample data</div>
</div>`;
// S6 business agent
H+=`<div class="${DOTS()}" id="s6" style="background:${SC[6][1]}">
 <div id="w6" class="win" style="left:80px;top:565px;width:770px;height:500px">

H+=`<div class="${DOTS(1)}" id="s7" style="background:${SC[7][1]}">
 ${stamp('st7','The catch','var(--pink)','var(--ink)',80,550)}
 ${[['ChatGPT','check','var(--lime)'],['Gemini','cross','#fff'],['Perplexity','cross','#fff']].map((r,i)=>`<div id="c${i}" class="card" style="left:80px;top:${670+i*130}px;width:640px;padding:20px 26px;border-radius:24px;background:${r[2]};${i?'box-shadow:8px 8px 0 #0E1030;':''}"><div class="row">${I(r[1],70)}<div style="font:900 46px Inter;letter-spacing:-1.5px;${i?'color:#8D8AA8':''}">${r[0]}</div><span class="chipui" style="margin-left:auto;background:${i?'#ECEAF3':'var(--ink)'};color:${i?'#8D8AA8':'#fff'}">${i?'not covered':'covered'}</span></div></div>`).join('')}

// S8 end card: Pop Burst avatar + follow + question
H+=`<div class="${DOTS()}" id="s8" style="background:${SC[8][1]}">
 <div class="glow" style="left:60px;top:540px;width:900px;height:900px;--gc:rgba(106,66,236,.35)"></div>
 <div id="cm8" class="card" style="left:80px;top:560px;width:700px;padding:22px 26px"><div class="row">${I('comment',76)}<div><div style="font:900 38px Inter;letter-spacing:-1px">Would you claim your shop?</div><div style="font:600 24px Inter;color:var(--muted);margin-top:6px">Yes or no, tell me in the comments</div></div></div></div>
 <div id="fl8" class="card" style="left:80px;top:770px;width:700px;padding:22px 24px"><div class="row"><img src="avatar.svg" alt="MRR Pop profile picture (Pop Burst)" style="width:132px;height:132px;border-radius:50%;border:5px solid var(--ink);flex:none"><div><div style="font:900 36px Inter;letter-spacing:-1px">@getmrrpop</div><div style="font:600 22px Inter;color:var(--muted);margin-top:4px">The business behind software</div></div></div>

 <div id="cur8" class="abs" style="left:760px;top:1230px;opacity:0;z-index:9">${I('cursor',84)}</div>
 <div id="conf8" class="abs" style="left:0;top:0;width:1080px;height:1920px"></div>
</div>`;

const CONF=[...Array(26)].map((_,i)=>{const a=(-170+i*(160/25))*Math.PI/180;return{dx:Math.cos(a)*(330+((i*53)%220)),dy:Math.sin(a)*(360+((i*71)%240)),r:(i*47)%360,c:['#6A42EC','#C6F03A','#FF6FB5','#FFD43B','#4C8DF6'][i%5],w:14+(i%3)*8,h:8+(i%2)*14}});
