<!doctype html><html><head><meta charset="utf-8"><style>
@font-face{font-family:Inter;src:url('../../../packages/theme/themes/mrrpop-v6/fonts/Inter-Variable.ttf');font-weight:100 900}

:root{--ink:#1B1838;--navy:#20244A;--violet:#6A42EC;--lime:#C6F03A;--yellow:#FFD43B;--pink:#FF6FB5;--paper:#FAF9FF;--red:#F0475A}
